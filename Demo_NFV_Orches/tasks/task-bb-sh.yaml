apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: bb-sh
  namespace: tekton-pipelines
spec:
  params:
  - name: script
    description: Shell script to run with /bin/sh -lc
  steps:
  - name: run
    image: alpine:3.20
    script: |
      #!/bin/sh
      set -eu
      echo "[bb-sh] start at $(date)"
      sh -lc -- "$(params.script)"
      echo "[bb-sh] done at $(date)"