# Tạo file manifest-bundle.yaml tạm thời
apiVersion: v1
kind: ConfigMap
metadata:
  name: vnf-inputs
  namespace: tekton-pipelines
data:
  # 1. Router (Giữ nguyên cái cũ)
  vnf-frr.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: PLACEHOLDER_NAME
      labels:
        app: PLACEHOLDER_NAME
        role: router
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: PLACEHOLDER_NAME
      template:
        metadata:
          labels:
            app: PLACEHOLDER_NAME
            role: router
        spec:
          containers:
          - name: router
            image: quay.io/frrouting/frr:8.5.1
            securityContext:
              privileged: true

  # 2. Firewall (MỚI: Dùng Alpine + IPTables thật)
  vnf-firewall.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: PLACEHOLDER_NAME
      labels:
        app: PLACEHOLDER_NAME
        role: firewall
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: PLACEHOLDER_NAME
      template:
        metadata:
          labels:
            app: PLACEHOLDER_NAME
            role: firewall
        spec:
          containers:
          - name: firewall
            image: alpine:3.18
            command: ["/bin/sh", "-c"]
            # Script mô phỏng hoạt động Firewall
            args:
              - |
                echo "Installing iptables..."
                apk add --no-cache iptables
                echo "Applying security rules..."
                iptables -P INPUT DROP
                echo "FIREWALL STARTED. Blocking unauthorized traffic."
                # Giữ container chạy để không bị CrashLoopBackOff
                tail -f /dev/null
            securityContext:
              privileged: true

  # 3. IDPS (MỚI: Mô phỏng hệ thống phát hiện xâm nhập)
  vnf-idps.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: PLACEHOLDER_NAME
      labels:
        app: PLACEHOLDER_NAME
        role: idps
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: PLACEHOLDER_NAME
      template:
        metadata:
          labels:
            app: PLACEHOLDER_NAME
            role: idps
        spec:
          containers:
          - name: idps
            image: alpine:3.18
            command: ["/bin/sh", "-c"]
            # Script mô phỏng quét gói tin
            args:
              - |
                echo "Initializing Pattern Matching Engine..."
                sleep 2
                echo "Loading signatures..."
                echo "IDPS ENGINE ACTIVE. Monitoring traffic flows..."
                while true; do
                  echo "$(date) - SCANNING: No threats detected in current flow."
                  sleep 10
                done