apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-admin
  namespace: tekton-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-admin-crb
subjects:
- kind: ServiceAccount
  name: tekton-admin
  namespace: tekton-pipelines
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
