apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kubectl-run
  namespace: core-router
spec:
  params:
  - name: args
    type: array
    description: Arguments passed to kubectl (e.g. ["get","pods","-A","-o","wide"])
  steps:
  - name: run
    image: localhost:32000/kubectl:1.30  # local registry — no internet dependency
    command: ["kubectl"]
    # Tekton array expansion: *(star) bung mảng thành nhiều argv
    args: ["$(params.args[*])"]
