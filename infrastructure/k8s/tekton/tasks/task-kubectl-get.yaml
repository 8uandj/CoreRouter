apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kubectl-get
  namespace: core-router
spec:
  params:
  - name: namespace
  - name: labelSelector
  steps:
  - name: get
    image: localhost:32000/kubectl:1.30  # local registry — no internet dependency
    command: ["kubectl"]
    args: ["-n","$(params.namespace)","get","pods","-l","$(params.labelSelector)","-o","wide"]
