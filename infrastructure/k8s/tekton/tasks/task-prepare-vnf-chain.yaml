apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: prepare-vnf-chain
  namespace: core-router
spec:
  workspaces:
  - name: ws
  params:
  - name: deployName
  - name: fileName
  - name: chainRunID
  - name: chainStage
  steps:
  - name: render-chain-relay
    image: localhost:32000/kubectl:1.30
    command: ["/bin/sh", "-ec"]
    env:
    - name: DEPLOY_NAME
      value: $(params.deployName)
    - name: FILE_NAME
      value: $(params.fileName)
    - name: RUN_ID
      value: $(params.chainRunID)
    - name: CHAIN_STAGE
      value: $(params.chainStage)
    args:
    - |
      case "$DEPLOY_NAME" in ''|*[!a-z0-9-]*|[!a-z0-9]*) echo "invalid deployment name" >&2; exit 1 ;; esac
      [ "${#DEPLOY_NAME}" -le 63 ] || { echo "deployment name too long" >&2; exit 1; }
      case "$RUN_ID" in ''|*[!a-z0-9-]*) echo "invalid run ID" >&2; exit 1 ;; esac
      [ "${#RUN_ID}" -le 32 ] || { echo "run ID too long" >&2; exit 1; }
      case "$CHAIN_STAGE" in 1|2) ;; *) echo "stage must be 1 or 2" >&2; exit 1 ;; esac
      [ "$FILE_NAME" = "vnf-chain-relay.yaml" ] || { echo "unsupported chain template" >&2; exit 1; }
      kubectl -n core-router get cm vnf-chain-inputs -o go-template='{{index .data "vnf-chain-relay.yaml"}}' > /workspace/ws/final.yaml
      [ -s /workspace/ws/final.yaml ] || { echo "missing relay template" >&2; exit 1; }
      sed -i "s/PLACEHOLDER_NAME/$DEPLOY_NAME/g; s/PLACEHOLDER_RUN_ID/$RUN_ID/g; s/PLACEHOLDER_STAGE/$CHAIN_STAGE/g" /workspace/ws/final.yaml
      if grep -q PLACEHOLDER /workspace/ws/final.yaml; then echo "unrendered placeholder" >&2; exit 1; fi
      echo "Rendered unique chain relay $DEPLOY_NAME stage=$CHAIN_STAGE run=$RUN_ID"
