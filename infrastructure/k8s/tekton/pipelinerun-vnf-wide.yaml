apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: vnf-lcm-wide-run-
  namespace: tekton-pipelines
spec:
  taskRunTemplate:
    serviceAccountName: tekton-admin
  pipelineRef:
    name: vnf-lcm-wide
  workspaces:
  - name: ws
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Mi
  params:
  - name: ns
    value: vnf
  - name: deployName
    value: vnf-frr
  - name: labelSelector
    value: app=vnf-frr
