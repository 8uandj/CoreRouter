apiVersion: apps/v1
kind: Deployment
metadata:
  name: PLACEHOLDER_NAME
  namespace: core-router
  labels:
    core-router/role: nat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: PLACEHOLDER_NAME
  template:
    metadata:
      labels:
        app: PLACEHOLDER_NAME
        core-router/role: nat
    spec:
      containers:
      - name: nat
        image: alpine:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo 'NAT VNF (placeholder, Option C)';
            apk add --no-cache busybox-extras >/dev/null 2>&1 || true;
            while true; do
              echo -e "HTTP/1.1 200 OK\r\nContent-Length: 7\r\n\r\nNAT-OK\n" | nc -l -p 8080 -q 1 || sleep 1;
            done
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: PLACEHOLDER_NAME-svc
  namespace: core-router
  labels:
    core-router/role: nat
spec:
  type: NodePort
  selector:
    app: PLACEHOLDER_NAME
  ports:
  - name: http
    port: 80
    targetPort: 8080
