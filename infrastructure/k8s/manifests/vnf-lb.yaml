apiVersion: apps/v1
kind: Deployment
metadata:
  name: PLACEHOLDER_NAME
  namespace: core-router
  labels:
    core-router/role: lb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: PLACEHOLDER_NAME
  template:
    metadata:
      labels:
        app: PLACEHOLDER_NAME
        core-router/role: lb
    spec:
      containers:
      - name: lb
        image: nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: PLACEHOLDER_NAME-svc
  namespace: core-router
  labels:
    core-router/role: lb
spec:
  type: NodePort
  selector:
    app: PLACEHOLDER_NAME
  ports:
  - name: http
    port: 80
    targetPort: 80
