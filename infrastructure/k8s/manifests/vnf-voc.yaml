apiVersion: apps/v1
kind: Deployment
metadata:
  name: PLACEHOLDER_NAME
  namespace: core-router
  labels:
    core-router/role: voc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: PLACEHOLDER_NAME
  template:
    metadata:
      labels:
        app: PLACEHOLDER_NAME
        core-router/role: voc
    spec:
      containers:
      - name: voc
        image: localhost:32000/python:3.11-alpine
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - "python3 /app/vvoc.py"
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: VVOC_PORT
          value: "8000"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "300m"
            memory: "192Mi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3
        volumeMounts:
        - name: vvoc-app
          mountPath: /app
      volumes:
      - name: vvoc-app
        configMap:
          name: vvoc-app
---
apiVersion: v1
kind: Service
metadata:
  name: PLACEHOLDER_NAME-svc
  namespace: core-router
  labels:
    core-router/role: voc
spec:
  type: NodePort
  selector:
    app: PLACEHOLDER_NAME
  ports:
  - name: http
    port: 80
    targetPort: 8000
