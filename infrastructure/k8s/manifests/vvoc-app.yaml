apiVersion: v1
kind: ConfigMap
metadata:
  name: vvoc-app
  namespace: core-router
  labels:
    core-router/role: voc
data:
  vvoc.py: |
    """vVOC - Option C custom Python placeholder VNF.

    Lightweight HTTP service exposing /healthz and /echo endpoints. This is a
    research placeholder for the Voice-Over-Carrier (vVOC) VNF used by the
    3S-COM SFC testbed. It MUST stay self-contained (stdlib only) so the
    container image can remain a vanilla python:3.11-alpine without extra
    pip installs.
    """

    import json
    import os
    import time
    from http.server import BaseHTTPRequestHandler, HTTPServer

    PORT = int(os.environ.get("VVOC_PORT", "8000"))
    START_TIME = time.time()


    class VVOCHandler(BaseHTTPRequestHandler):
        def _write_json(self, code: int, payload: dict) -> None:
            body = json.dumps(payload).encode("utf-8")
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):  # noqa: N802 (BaseHTTPRequestHandler API)
            if self.path == "/healthz":
                self._write_json(200, {"status": "ok", "uptime_s": time.time() - START_TIME})
                return
            if self.path == "/echo":
                self._write_json(200, {"role": "vvoc", "msg": "hello-from-vvoc"})
                return
            self._write_json(404, {"error": "not_found", "path": self.path})

        def log_message(self, format, *args):  # silence default stderr access log
            return


    def main() -> None:
        server = HTTPServer(("0.0.0.0", PORT), VVOCHandler)
        print(f"vVOC listening on :{PORT}", flush=True)
        server.serve_forever()


    if __name__ == "__main__":
        main()
